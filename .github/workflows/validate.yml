name: Validate OCP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Unit and isolated integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate all profiles
        run: |
          for manifest in profiles/*/profile.json; do
            [ -f "$manifest" ] || continue
            ./ocp validate "$(basename "$(dirname "$manifest")")"
          done
